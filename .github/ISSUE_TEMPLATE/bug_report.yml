name: Bug report
description: Something doesn't work in PhotoCraft for Android
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This is the unofficial Android port. Problems that also happen in the
        desktop or web PhotoCraft belong at https://github.com/storytold/photocraft/issues instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new document
        2. Pick the Brush tool
        3. ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Help › About PhotoCraft, or the release you installed (for example 0.9.0-3).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Tablet and Android version
      placeholder: e.g. Samsung Galaxy Tab S9, Android 14
    validations:
      required: true
  - type: input
    id: pen
    attributes:
      label: Pen, keyboard or other input (if it matters)
      placeholder: e.g. S Pen, Wacom One pen, Bluetooth keyboard, finger only
